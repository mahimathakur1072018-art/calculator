<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Interactive Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }

    .calculator {
      background-color: #1e1e2f;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      width: 320px;
    }

    #display {
      width: 100%;
      height: 70px;
      background-color: #2a2a40;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 15px;
      font-size: 2rem;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 600;
      cursor: pointer;
      background-color: #32324e;
      color: #ffffff;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #434366;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background-color: #ff9f0a;
      color: #ffffff;
    }

    .operator:hover {
      background-color: #ffb340;
    }

    .action {
      background-color: #5c5c7a;
    }

    .action:hover {
      background-color: #707094;
    }

    .equals {
      background-color: #30d158;
      grid-column: span 2;
    }

    .equals:hover {
      background-color: #4ae06e;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" readonly placeholder="0">
    <div class="buttons">
      <button class="action" onclick="clearDisplay()">AC</button>
      <button class="action" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      if (display.value === 'Error') display.value = '';
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      if (display.value === 'Error') {
        display.value = '';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculate() {
      try {
        // Replace visual symbols with standard math operators if needed, then evaluate
        const expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
        if (expression.trim() === '') return;
        
        const result = new Function('return ' + expression)();
        display.value = Number.isFinite(result) ? result : 'Error';
      } catch (error) {
        display.value = 'Error';
      }
    }

    // Optional: Add keyboard support
    document.addEventListener('keydown', (event) => {
      const key = event.key;
      if (/[0-9+\-*/.%]/.test(key)) {
        appendValue(key);
      } else if (key === 'Enter') {
        event.preventDefault();
        calculate();
      } else if (key === 'Backspace') {
        deleteLast();
      } else if (key === 'Escape') {
        clearDisplay();
      }
    });
  </script>

</body>
</html>
